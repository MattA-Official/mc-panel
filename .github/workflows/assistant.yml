name: Assistant

# Runs Claude Code in Actions for project management: arranging the Projects board through
# GraphQL, and labelling, milestoning and triaging issues and pull requests. It can't change
# code or releases: its token only reads the repository, and the Release and Release notes
# workflows own releases. What it may do is set out in .github/assistant/INSTRUCTIONS.md.
#
# Start it by writing @claude in an issue, a pull request or a review comment, or from the
# Actions tab (or the API) with a written request. Only the repository owner can start it.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  a Claude subscription token from `claude setup-token`, or
#   ANTHROPIC_API_KEY        an Anthropic API key. One of the two is required; the
#                            subscription token wins when both are set.
#   PROJECTS_TOKEN           optional. A token that can reach the organisation's Projects
#                            board (classic with the `project` scope, or fine-grained with
#                            organisation Projects read and write), used through
#                            gh-projects. Plain gh uses this workflow's own token for
#                            issues and PRs.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: What to do, e.g. "Add every open 1.1.0 issue to the board as Todo"
        required: true

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  assistant:
    # The repository is public, so only Matt can start a run (the repository belongs to the
    # teamflytower organisation, so repository_owner isn't a person). The text must also
    # mention @claude, except when dispatched with a prompt.
    if: >-
      github.actor == 'MattA-Official' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Read only: nothing here can push code, merge, or touch releases.
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # Started from a pull request, the action checks out that pull request's branch, so the
      # board wrapper and the instructions are installed from main first, outside the
      # workspace, where the branch can't replace them.
      - name: Install the assistant's tools from main
        run: |
          sudo install -m 0755 .github/assistant/gh-projects /usr/local/bin/gh-projects
          sudo install -D -m 0644 .github/assistant/INSTRUCTIONS.md \
            /usr/local/share/flytower-assistant/INSTRUCTIONS.md

      - id: assistant
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        env:
          # The action points GH_TOKEN at its own token, so the board token travels under
          # its own name and gh-projects uses it.
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ !secrets.CLAUDE_CODE_OAUTH_TOKEN && secrets.ANTHROPIC_API_KEY || '' }}
          # Progress comments come from the workflow's own bot, not from Matt.
          github_token: ${{ github.token }}
          # Dispatched runs carry their own request; comment runs read it from the comment.
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
          # Other people's comments stay out of the context, which limits what a stranger
          # on a public issue can steer.
          include_comments_by_actor: MattA-Official
          # Only the gh commands the job needs: gh as a whole can run code (gh extension,
          # gh alias --shell). Files can only be written under .assistant/, for GraphQL.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Bash(gh issue:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh label:*),Bash(gh release view:*),Bash(gh release list:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh search:*),Bash(gh api:*),Bash(gh-projects:*),Read,Glob,Grep,Edit(.assistant/**),Write(.assistant/**)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(gh extension:*),Bash(gh alias:*),Bash(gh config:*),Bash(gh auth:*)"
            --append-system-prompt "Before doing anything else, read /usr/local/share/flytower-assistant/INSTRUCTIONS.md and follow it."

      # The action hides Claude's output on public repositories. Comment runs reply on the
      # issue, but a dispatched run has nowhere to reply and a failed run hides its reason
      # (a bad key, no credit). So print Claude's final reply, and any tool calls it was
      # refused, to the log and the run summary. Nothing else from the run is shown.
      - name: Report the result
        if: always() && (failure() || github.event_name == 'workflow_dispatch')
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          [[ -f "$out" ]] || exit 0
          result=$(jq -r 'if type == "array" then .[] else . end | select(.type == "result")' "$out")
          {
            echo "## Assistant reply"
            jq -r '.result // .errors // "(no reply)"' <<<"$result" | head -c 20000
            denied=$(jq -r '.permission_denials // [] | .[] | "- \(.tool_name): \(.tool_input | tostring | .[0:200])"' <<<"$result")
            if [[ -n "$denied" ]]; then
              printf '\n## Refused tool calls\n%s\n' "$denied"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
