name: Assistant

# Runs Claude Code in Actions for project management and release housekeeping: editing
# releases, arranging the Projects board through GraphQL, and labelling, milestoning and
# triaging issues and pull requests. It doesn't change code. What it may do is set out in
# .github/assistant/INSTRUCTIONS.md.
#
# Start it by writing @claude in an issue, a pull request or a review comment, or from the
# Actions tab (or the API) with a written request. Only the repository owner can start it.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  a Claude subscription token from `claude setup-token`, or
#   ANTHROPIC_API_KEY        an Anthropic API key. One of the two is required; the
#                            subscription token wins when both are set.
#   PROJECTS_TOKEN           optional. A classic personal access token with the `repo`
#                            and `project` scopes, needed for the user-owned Projects
#                            board, used through .github/assistant/gh-projects. Plain gh
#                            uses this workflow's own token for releases, issues and PRs.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: What to do, e.g. "Add every open 1.1.0 issue to the board as Todo"
        required: true

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  assistant:
    # The repository is public, so only the owner can start a run. The text must also
    # mention @claude, except when dispatched with a prompt.
    if: >-
      github.actor == github.repository_owner && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Editing releases needs contents: write. The workflow never pushes code.
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: assistant
        uses: anthropics/claude-code-action@v1
        env:
          # The action points GH_TOKEN at its own token, so the board token travels under
          # its own name and .github/assistant/gh-projects uses it.
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ !secrets.CLAUDE_CODE_OAUTH_TOKEN && secrets.ANTHROPIC_API_KEY || '' }}
          # Progress comments come from the workflow's own bot, not from Matt.
          github_token: ${{ github.token }}
          # Dispatched runs carry their own request; comment runs read it from the comment.
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
          # Other people's comments stay out of the context, which limits what a stranger
          # on a public issue can steer.
          include_comments_by_actor: ${{ github.repository_owner }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Bash(gh:*),Bash(.github/assistant/gh-projects:*),Read,Glob,Grep"
            --disallowedTools "Bash(git push:*),Bash(git commit:*)"
            --append-system-prompt "Before doing anything else, read .github/assistant/INSTRUCTIONS.md and follow it."

      # The action hides Claude's output on public repositories. Comment runs reply on the
      # issue, but a dispatched run has nowhere to reply and a failed run hides its reason
      # (a bad key, no credit). So print Claude's final reply, and any tool calls it was
      # refused, to the log and the run summary. Nothing else from the run is shown.
      - name: Report the result
        if: always() && (failure() || github.event_name == 'workflow_dispatch')
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          [[ -f "$out" ]] || exit 0
          result=$(jq -r 'if type == "array" then .[] else . end | select(.type == "result")' "$out")
          {
            echo "## Assistant reply"
            jq -r '.result // .errors // "(no reply)"' <<<"$result" | head -c 20000
            denied=$(jq -r '.permission_denials // [] | .[] | "- \(.tool_name): \(.tool_input | tostring | .[0:200])"' <<<"$result")
            if [[ -n "$denied" ]]; then
              printf '\n## Refused tool calls\n%s\n' "$denied"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
