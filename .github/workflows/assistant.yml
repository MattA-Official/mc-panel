name: Assistant

# Runs Claude Code in Actions for project management and release housekeeping: editing
# releases, arranging the Projects board through GraphQL, and labelling, milestoning and
# triaging issues and pull requests. It doesn't change code. What it may do is set out in
# .github/assistant/INSTRUCTIONS.md.
#
# Start it by writing @claude in an issue, a pull request or a review comment, or from the
# Actions tab (or the API) with a written request. Only the repository owner can start it.
#
# Secrets:
#   ANTHROPIC_API_KEY   required. An Anthropic API key.
#   PROJECTS_TOKEN      optional. A classic personal access token with the `repo` and
#                       `project` scopes, needed for the user-owned Projects board.
#                       Without it, gh uses this workflow's own token, which can edit
#                       releases, issues and pull requests but can't reach the board.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: What to do, e.g. "Add every open 1.1.0 issue to the board as Todo"
        required: true

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  assistant:
    # The repository is public, so only the owner can start a run. The text must also
    # mention @claude, except when dispatched with a prompt.
    if: >-
      github.actor == github.repository_owner && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Editing releases needs contents: write. The workflow never pushes code.
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: assistant
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Progress comments come from the workflow's own bot, not from Matt.
          github_token: ${{ github.token }}
          # Dispatched runs carry their own request; comment runs read it from the comment.
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
          # Other people's comments stay out of the context, which limits what a stranger
          # on a public issue can steer.
          include_comments_by_actor: ${{ github.repository_owner }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Bash(gh:*),Read,Glob,Grep"
            --disallowedTools "Bash(git push:*),Bash(git commit:*)"
            --append-system-prompt "Before doing anything else, read .github/assistant/INSTRUCTIONS.md and follow it."

      # The action hides Claude's output on public repositories, which also hides why a run
      # failed (a bad key, no credit, an unknown model). Print only the final result line.
      - name: Say why the run failed
        if: failure()
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          [[ -f "$out" ]] || exit 0
          jq -r 'if type == "array" then .[] else . end | select(.type == "result") | .result // .errors // empty' "$out" | head -c 2000
