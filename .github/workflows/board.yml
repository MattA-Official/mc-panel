name: Board

# Keeps the Status column of the teamflytower organisation's Flytower board in step with
# issues and pull requests, as each one opens, closes, merges or changes milestone. The rules
# are in scripts/board-sync.ts. Needs the PROJECTS_TOKEN secret (a fine-grained token for the
# organisation with Projects read and write, or a classic token with `repo` and `project`),
# since the workflow token can't reach a Projects board.
on:
  issues:
    types: [opened, closed, reopened, milestoned, demilestoned]
  pull_request:
    types: [opened, reopened, closed]
  milestone:
    types: [created, edited, closed, opened]
  workflow_dispatch:

permissions:
  contents: read

# One sync at a time; each one reads the whole board, so a queued run catches up on
# everything that happened before it.
concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    # Pull requests from forks don't get secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun scripts/board-sync.ts
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
