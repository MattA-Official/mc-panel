name: Release notes

# Rewrites an existing release's notes from main, so a summary added later in
# .github/release-notes/ reaches releases that are already out.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.1.0-beta.3
        required: true

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Write notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::no tag $TAG"; exit 1; }
          bun scripts/release-notes.ts "$TAG" > NOTES.md
          cat NOTES.md

      - name: Update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --notes-file NOTES.md
