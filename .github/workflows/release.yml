name: Release

on:
  push:
    tags: ['v*']
  # Releasing from the Actions tab creates the tag too.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Work out the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="v${INPUT_VERSION#v}"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version $tag"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "$tag already exists"; exit 1; fi
            git tag "$tag" "$GITHUB_SHA"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: shellcheck installer/*.sh

      - name: Build panel
        run: bun run build

      - name: Package
        run: |
          version="${TAG#v}"
          bun scripts/package.ts --version "$version" --arch amd64 --out dist
          bun scripts/package.ts --version "$version" --arch arm64 --out dist
          cp installer/install.sh dist/install.sh
          cd dist && sha256sum flytower-*.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS

      - name: Sign
        env:
          FLYTOWER_SIGNING_KEY: ${{ secrets.FLYTOWER_SIGNING_KEY }}
        run: |
          if [[ -z "$FLYTOWER_SIGNING_KEY" ]] || grep -q PENDING installer/release-key.pem; then
            echo "::error::FLYTOWER_SIGNING_KEY and installer/release-key.pem are both needed to release"
            exit 1
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$FLYTOWER_SIGNING_KEY" > "$key"
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            first="$(head -c 40 "$key" | head -1 | grep -o -- '-----BEGIN [A-Z ]*-----' || echo 'no PEM header')"
            echo "::error::FLYTOWER_SIGNING_KEY isn't a private key openssl can read (it starts with: $first). It should be the whole file from 'openssl genpkey -algorithm ed25519', from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----."
            exit 1
          fi
          if [[ "$(openssl pkey -in "$key" -pubout)" != "$(cat installer/release-key.pem)" ]]; then
            echo "::error::FLYTOWER_SIGNING_KEY doesn't match installer/release-key.pem"
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS | base64 -w0 > dist/SHA256SUMS.sig
          # Check against the committed key, as the installer will.
          base64 -d dist/SHA256SUMS.sig > sig.bin
          openssl pkeyutl -verify -pubin -inkey installer/release-key.pem -rawin \
            -in dist/SHA256SUMS -sigfile sig.bin
          rm sig.bin

      - name: Release notes
        run: bun scripts/release-notes.ts "$TAG" > dist/NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          flags=()
          # Everything before 1.0 is a pre-release.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" --target "$GITHUB_SHA" \
            --title "Flytower $version" \
            --notes-file dist/NOTES.md \
            dist/flytower-*.tar.gz dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.sig
