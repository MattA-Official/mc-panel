name: Rust

# Only runs when Rust code, or the panel code that calls it, changes
# (docs/decisions/0001-rust-and-go.md, rule 6).
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'protocol/**'
      - 'apps/panel/server/disk.ts'
      - 'apps/panel/test/disk.test.ts'
      - 'packages/protocol/src/subscribe*.ts'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'protocol/**'
      - 'apps/panel/server/disk.ts'
      - 'apps/panel/test/disk.test.ts'
      - 'packages/protocol/src/subscribe*.ts'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  # Licences, advisories, duplicate crates and sources, from crates/deny.toml. Once per run:
  # deny.toml names both targets, so there is nothing to repeat per architecture.
  deny:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates
    env:
      CARGO_DENY_VERSION: 0.20.2
      # From the release's own .sha256 file.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (pinned in crates/rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - run: cargo deny --locked check

  check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # The release cross-links arm64 from amd64; this proves those binaries run.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (pinned in crates/rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      # The test build, with the testing.* subscriptions, for the client's tests below.
      - run: cargo build --locked --features testing --bin flytower-agent-testing --target ${{ matrix.target }}

      # The panel's tests check flytower-du gives exactly the numbers of the TypeScript walk.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test apps/panel/test/disk.test.ts
        working-directory: .
        env:
          FLYTOWER_DU: ${{ github.workspace }}/crates/target/${{ matrix.target }}/release/flytower-du

      # The subscription client against the real agent, across a restart (protocol 2).
      - run: bun test packages/protocol/src/subscribe.test.ts
        working-directory: .
        env:
          FLYTOWER_AGENT_TESTING: ${{ github.workspace }}/crates/target/${{ matrix.target }}/debug/flytower-agent-testing
