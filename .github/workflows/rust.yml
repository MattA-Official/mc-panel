name: Rust

# Only runs when Rust code, or the panel code that calls it, changes
# (docs/decisions/0001-rust-and-go.md, rule 6).
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'protocol/**'
      - 'apps/panel/server/disk.ts'
      - 'apps/panel/test/disk.test.ts'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'protocol/**'
      - 'apps/panel/server/disk.ts'
      - 'apps/panel/test/disk.test.ts'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # The release cross-links arm64 from amd64; this proves those binaries run.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned in crates/rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}

      # The panel's tests check flytower-du gives exactly the numbers of the TypeScript walk.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test apps/panel/test/disk.test.ts
        working-directory: .
        env:
          FLYTOWER_DU: ${{ github.workspace }}/crates/target/${{ matrix.target }}/release/flytower-du
