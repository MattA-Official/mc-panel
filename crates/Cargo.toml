[workspace]
resolver = "3"
members = ["flytower-agent", "flytower-du", "flytower-map"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# CI runs clippy with `-D warnings`, so every warning here fails the build.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Every `#[allow]` or `#[expect]` in the code says why, next to it.
allow_attributes_without_reason = "warn"
# Nursery lints left off, and why:
# - Long first doc paragraphs are how this code explains itself; splitting them hurts.
too_long_first_doc_paragraph = "allow"
# - `map_or_else` with two closures reads worse than the `if let` or `match` it replaces.
option_if_let_else = "allow"
# - `mul_add` can change the last bit of a float, and the map's pixels must not change.
suboptimal_flops = "allow"

# Small static binaries: the release tarball carries one per architecture.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
