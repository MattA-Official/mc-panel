[workspace]
resolver = "3"
members = ["flytower-agent", "flytower-du", "flytower-map"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Small static binaries: the release tarball carries one per architecture.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
